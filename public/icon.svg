<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="excelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#107C41" />
      <stop offset="100%" stop-color="#0B552C" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#excelGrad)" />

  <!-- Excel Grid Frame in Background -->
  <g opacity="0.18" stroke="#ffffff" stroke-width="4">
    <line x1="96" y1="160" x2="416" y2="160" />
    <line x1="96" y1="220" x2="416" y2="220" />
    <line x1="96" y1="280" x2="416" y2="280" />
    <line x1="96" y1="340" x2="416" y2="340" />
    <line x1="180" y1="120" x2="180" y2="380" />
    <line x1="280" y1="120" x2="280" y2="380" />
    <line x1="380" y1="120" x2="380" y2="380" />
  </g>

  <!-- Central Motorcycle & Excel Badge with Shadow -->
  <g filter="url(#shadow)">
    <!-- Excel Book badge -->
    <rect x="100" y="116" width="130" height="150" rx="18" fill="#0C5E31" stroke="#ffffff" stroke-width="6" />
    <text x="165" y="215" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="96" text-anchor="middle">X</text>
  </g>

  <!-- Motorcycle & Spare Parts Emblem -->
  <g transform="translate(200, 160)" filter="url(#shadow)">
    <!-- Sprocket / Gear circle -->
    <circle cx="160" cy="160" r="100" fill="#185C37" stroke="#ffffff" stroke-width="8" />
    <circle cx="160" cy="160" r="40" fill="#0B552C" stroke="#85E0A3" stroke-width="6" />

    <!-- Gear teeth -->
    <g fill="#ffffff" opacity="0.9">
      <rect x="150" y="44" width="20" height="24" rx="4" />
      <rect x="150" y="252" width="20" height="24" rx="4" />
      <rect x="44" y="150" width="24" height="20" rx="4" />
      <rect x="252" y="150" width="24" height="20" rx="4" />
      <rect x="75" y="75" width="22" height="22" rx="4" transform="rotate(45 86 86)" />
      <rect x="225" y="75" width="22" height="22" rx="4" transform="rotate(45 236 86)" />
      <rect x="75" y="225" width="22" height="22" rx="4" transform="rotate(45 86 236)" />
      <rect x="225" y="225" width="22" height="22" rx="4" transform="rotate(45 236 236)" />
    </g>

    <!-- Motorcycle Wrench & Bolt silhouette -->
    <path d="M 130 160 L 190 160" stroke="#FFD966" stroke-width="12" stroke-linecap="round" />
    <circle cx="160" cy="160" r="16" fill="#FFD966" />
  </g>

  <!-- App Label at bottom -->
  <text x="256" y="440" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="34" text-anchor="middle" letter-spacing="1">SPEA ZA PIKIPIKI</text>
</svg>
